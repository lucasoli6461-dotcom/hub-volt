function atualizarRelogioPonto() {
    const elHora = document.getElementById('relogioHoraDigital'); const elData = document.getElementById('relogioDataCompleta');
    if(!elHora || !elData) return;
    const d = new Date();
    const horaStr = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
    const dias = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB']; const meses = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
    const dataStr = `${dias[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')} ${meses[d.getMonth()]} ${d.getFullYear()}`;
    elHora.innerText = horaStr; elData.innerText = dataStr;
}

async function registrarBatidaPonto(tipoBatida) {
    if(!usuarioLogado) return alert("Usuário não identificado.");
    const d = new Date();
    const dataIso = d.toISOString().split('T')[0];
    const horaExata = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const docId = `${usuarioLogado}_${dataIso}`;
    
    try {
        const docRef = db.collection("rh_ponto").doc(docId);
        const docSnap = await docRef.get();
        let payload = {};
        
        if (tipoBatida === 'Entrada') {
            if(docSnap.exists && docSnap.data().horaEntrada) return alert("Você já registrou a Entrada hoje!");
            payload = { nome: usuarioLogado, data: dataIso, horaEntrada: horaExata, timestamp: firebase.firestore.FieldValue.serverTimestamp() };
        } else if (tipoBatida === 'Saida Almoco') {
            payload = { horaSaidaAlmoco: horaExata };
        } else if (tipoBatida === 'Retorno Almoco') {
            payload = { horaRetornoAlmoco: horaExata };
        } else if (tipoBatida === 'Saida') {
            payload = { horaFim: horaExata };
        }

        await docRef.set(payload, { merge: true });
        alert(`✅ Ponto registrado com sucesso: ${tipoBatida} às ${horaExata}`);
        voltarAoDash();
    } catch(e) { alert("Erro de conexão ao bater ponto."); }
}

function abrirModuloRelatorioPonto() { navegarAdmin('adminRelatorioPonto'); carregarRelatorioPontos(); }

async function carregarRelatorioPontos() {
    const dataFiltro = document.getElementById('filtroDataPonto').value;
    const tbody = document.getElementById('tabelaRelatorioPonto');
    if(!dataFiltro) return;
    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #00aaff; padding: 30px;">Buscando registros na nuvem...</td></tr>';
    
    try {
        const snap = await db.collection("rh_ponto").where("data", "==", dataFiltro).get();
        tbody.innerHTML = ''; let contador = 0;
        snap.forEach(doc => {
            contador++; const p = doc.data();
            const ent = p.horaEntrada || '--:--'; const sAlm = p.horaSaidaAlmoco || '--:--'; const rAlm = p.horaRetornoAlmoco || '--:--'; const fim = p.horaFim || '--:--';
            
            // Calculo Simples de Carga Horária se tiver entrada e saída
            let cargaTexto = "Pendente";
            if(p.horaEntrada && p.horaFim) {
                let he = p.horaEntrada.split(':'); let hs = p.horaFim.split(':');
                let minE = parseInt(he[0])*60 + parseInt(he[1]); let minS = parseInt(hs[0])*60 + parseInt(hs[1]);
                let diff = minS - minE;
                
                // Desconto do almoço se bateu
                if(p.horaSaidaAlmoco && p.horaRetornoAlmoco) {
                    let hsa = p.horaSaidaAlmoco.split(':'); let hra = p.horaRetornoAlmoco.split(':');
                    let minSA = parseInt(hsa[0])*60 + parseInt(hsa[1]); let minRA = parseInt(hra[0])*60 + parseInt(hra[1]);
                    diff -= (minRA - minSA);
                }
                if(diff > 0) { let fh = Math.floor(diff/60); let fm = diff%60; cargaTexto = `${fh}h ${fm}m`; }
            }

            tbody.innerHTML += `<tr><td><strong style="color:white;">${p.nome}</strong></td><td><span class="badge-data">${p.data}</span></td><td style="color:var(--success-green); font-weight:bold;">${ent}</td><td style="color:var(--warning-yellow);">${sAlm}</td><td style="color:var(--warning-yellow);">${rAlm}</td><td style="color:var(--error-red); font-weight:bold;">${fim}</td><td style="color:#aaa;">${cargaTexto}</td></tr>`;
        });
        if(contador === 0) tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #888; padding: 30px;">Nenhum ponto registrado no dia ${dataFiltro}.</td></tr>`;
    } catch(e) { tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--error-red); padding: 30px;">Erro ao buscar dados.</td></tr>'; }
}

async function enviarContagemCega() {
    const endereco = document.getElementById('contagemEndereco').value.trim().toUpperCase();
    const bipProduto = document.getElementById('contagemProduto').value.trim();
    const qtdFisica = parseInt(document.getElementById('contagemQtd').value);

    if(!endereco || !bipProduto || isNaN(qtdFisica)) return alert("Preencha o Endereço, bipe o Produto e insira a Quantidade Física correta.");
    
    let prodInfo = catalogoCompleto.find(p => p.ean === bipProduto || p.sku.toUpperCase() === bipProduto.toUpperCase() || p.masterEan === bipProduto);
    if(!prodInfo) return alert("Produto não reconhecido no catálogo.");

    try {
        const mapSnap = await db.collection("estoque_posicoes").where("endereco", "==", endereco).where("sku", "==", prodInfo.sku).get();
        let qtdSistemaTotal = 0; let docsAfetados = [];
        
        mapSnap.forEach(m => { 
            let d = m.data(); 
            qtdSistemaTotal += d.quantidade; 
            docsAfetados.push(m.id);
        });

        await db.collection("auditoria_contagens").add({
            operador: usuarioLogado, endereco: endereco, sku: prodInfo.sku, 
            qtdSistema: qtdSistemaTotal, qtdFisica: qtdFisica, 
            divergencia: (qtdSistemaTotal !== qtdFisica),
            data: new Date().toISOString(), status: (qtdSistemaTotal !== qtdFisica) ? 'pendente' : 'ok',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        if(qtdSistemaTotal === qtdFisica) {
            alert(`✅ Contagem exata! O sistema já possuía ${qtdSistemaTotal} un.`);
        } else {
            alert(`⚠️ DIVERGÊNCIA! O sistema esperava ${qtdSistemaTotal} un. O desvio foi gravado para o Administrador analisar.`);
        }
        
        document.getElementById('contagemProduto').value = ''; document.getElementById('contagemQtd').value = ''; document.getElementById('contagemProduto').focus();
    } catch(e) { alert("Erro de conexão com a base de dados."); }
}

function abrirModuloDivergencias() { navegarAdmin('adminDivergencias'); carregarFilaDivergencias(); }

async function carregarFilaDivergencias() {
    const tbody = document.getElementById('tabelaFilaDivergencias'); tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--warning-yellow); padding: 30px;">Buscando furos de estoque na nuvem...</td></tr>';
    try {
        const snap = await db.collection("auditoria_contagens").where("status", "==", "pendente").get();
        tbody.innerHTML = ''; let contador = 0;
        
        let audits = []; snap.forEach(doc => audits.push({id: doc.id, ...doc.data()}));
        audits.sort((a,b) => { let tA = a.timestamp ? a.timestamp.toMillis() : 0; let tB = b.timestamp ? b.timestamp.toMillis() : 0; return tB - tA; });

        audits.forEach(a => {
            contador++;
            let badgeDiff = a.qtdFisica > a.qtdSistema ? `<span style="color:var(--success-green); font-weight:bold;">(+${a.qtdFisica - a.qtdSistema})</span>` : `<span style="color:var(--error-red); font-weight:bold;">(${a.qtdFisica - a.qtdSistema})</span>`;
            let d = new Date(a.data); let strData = d.toLocaleDateString('pt-BR') + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
            tbody.innerHTML += `<tr><td><strong style="color:white;">${a.operador}</strong><br><span style="font-size:10px;color:#888;">${strData}</span></td><td><span class="badge-endereco">${a.endereco}</span></td><td><strong style="color:white;">${a.sku}</strong></td><td style="color:#aaa;">${a.qtdSistema} un</td><td><strong style="color:var(--warning-yellow); font-size:16px;">${a.qtdFisica} un</strong> <br>${badgeDiff}</td><td style="text-align:right;"><button class="btn-outline-2" style="border-color:var(--volt-green); color:var(--volt-green); margin-right:5px;" onclick="ajustarDivergenciaAuditoria('${a.id}', '${a.endereco}', '${a.sku}', ${a.qtdSistema}, ${a.qtdFisica})">✔ Ajustar Saldo</button><button class="btn-outline-2" style="border-color:#555; color:#aaa;" onclick="recusarDivergencia('${a.id}')">✖ Recusar</button></td></tr>`;
        });
        if(contador === 0) tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888; padding: 30px;">O estoque está 100% acurado. Nenhuma divergência pendente.</td></tr>';
    } catch(e) {}
}

async function recusarDivergencia(idReq) { if(confirm("Ignorar esta contagem do operador e manter o saldo atual do sistema?")) { await db.collection("auditoria_contagens").doc(idReq).update({ status: 'recusada' }); carregarFilaDivergencias(); } }

async function ajustarDivergenciaAuditoria(idReq, endereco, sku, qtdSis, qtdFisica) {
    if(!confirm(`Confirma o ajuste do saldo do sistema de ${qtdSis} para a contagem real de ${qtdFisica} unidades?`)) return;
    try {
        let prodInfo = catalogoCompleto.find(p => p.sku.toUpperCase() === sku.toUpperCase());
        if(!prodInfo) return alert("Produto não encontrado no catálogo base.");

        const diff = qtdFisica - qtdSis; 
        const mapSnap = await db.collection("estoque_posicoes").where("endereco", "==", endereco).where("sku", "==", sku).get();
        
        if (diff > 0) {
            if(!mapSnap.empty) {
                let docAdd = mapSnap.docs[0];
                await db.collection("estoque_posicoes").doc(docAdd.id).update({ quantidade: firebase.firestore.FieldValue.increment(diff) });
            } else {
                let newDocId = `${endereco}_AJUSTE_${prodInfo.ean}`;
                await db.collection("estoque_posicoes").doc(newDocId).set({ endereco: endereco, lote: 'AJUSTE-AUDITORIA', ean: prodInfo.ean, sku: prodInfo.sku, quantidade: diff, caixas: 1, dataEntrada: new Date().toISOString().split('T')[0], familia: 'Outros', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            }
        } else if (diff < 0) {
            let falta = Math.abs(diff);
            for(let m of mapSnap.docs) {
                if(falta <= 0) break;
                let data = m.data();
                let abater = Math.min(falta, data.quantidade);
                falta -= abater;
                if(data.quantidade === abater) {
                    await db.collection("estoque_posicoes").doc(m.id).delete();
                } else {
                    await db.collection("estoque_posicoes").doc(m.id).update({ quantidade: firebase.firestore.FieldValue.increment(-abater) });
                }
            }
        }

        await db.collection("auditoria_contagens").doc(idReq).update({ status: 'ajustada_admin' });
        alert("✅ Estoque corrigido com sucesso e batendo com o físico!");
        carregarFilaDivergencias();
    } catch(e) { alert("Erro ao ajustar o banco de dados."); console.log(e); }
}

function abrirModuloEnderecamentoEstoque(){navegarEstoque('estoqueEnderecamento');carregarMapaEstoque('Op');}
async function carregarMapaEstoque(perfil){const tbody=document.getElementById(perfil==='Admin'?'tabelaMapaEstoque':'tabelaMapaEstoqueOp');tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--volt-green);padding:20px;">Buscando mapa do estoque...</td></tr>';try{const snapshot=await db.collection("estoque_posicoes").get();let itens=[];snapshot.forEach(doc=>{itens.push({id:doc.id,...doc.data()})});itens.sort((a,b)=>(a.endereco||'').localeCompare(b.endereco||''));tbody.innerHTML='';let contador=0;itens.forEach(item=>{if(item.quantidade>0){contador++;const dEnt=item.dataEntrada?new Date(item.dataEntrada).toLocaleDateString('pt-BR'):'-';tbody.innerHTML+=`<tr style="border-bottom:1px solid #222;"><td><span class="badge-endereco">${item.endereco}</span></td><td><strong>${item.sku}</strong></td><td><span class="badge-familia">${item.familia||'-'}</span></td><td><span class="badge-lote">${item.lote}</span><br><span style="font-size:10px;color:#888;">${dEnt}</span></td><td>${item.caixas} cx</td><td style="color:var(--volt-green);font-weight:bold;font-size:16px;">${item.quantidade}</td><td><button class="btn-outline-2" style="border-color:var(--blue-action);color:var(--blue-action);margin-right:5px;" onclick="abrirEdicaoInbound('${item.id}','${perfil}')">✏️</button><button class="btn-outline-2" style="border-color:var(--error-red);color:var(--error-red);" onclick="zerarPosicaoEstoque('${item.id}','${perfil}')">✖</button></td></tr>`;}});if(contador===0)tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:#888;">Nenhum produto alocado nos endereços ainda.</td></tr>';}catch(e){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--error-red);">Erro ao carregar mapa.</td></tr>';}}

async function guardarEstoqueNuvem(perfil='Admin'){
    const fieldAddress=perfil==='Admin'?'inboundAddress':'inboundAddressEstoque';const fieldLot=perfil==='Admin'?'inboundLot':'inboundLotEstoque';const fieldProduct=perfil==='Admin'?'inboundProduct':'inboundProductEstoque';const fieldMultiplier=perfil==='Admin'?'inboundMultiplier':'inboundMultiplierEstoque';const fieldData=perfil==='Admin'?'inboundData':'inboundDataEstoque';const fieldFamilia=perfil==='Admin'?'inboundFamilia':'inboundFamiliaEstoque';
    const endereco=document.getElementById(fieldAddress).value.trim().toUpperCase();const lote=document.getElementById(fieldLot).value.trim().toUpperCase();const eanBipado=document.getElementById(fieldProduct).value.trim();const mult=parseInt(document.getElementById(fieldMultiplier).value)||1;const dataEnt=document.getElementById(fieldData).value;const fam=document.getElementById(fieldFamilia).value;
    if(!endereco||!lote||!eanBipado)return alert("Preencha Endereço, Lote e bipe o Produto.");
    
    let produtoEncontrado=null;let isMaster=false;
    for(let prod of catalogoCompleto){if(prod.eanUnitario===eanBipado){produtoEncontrado=prod;isMaster=false;break;}if(prod.eanMaster&&prod.eanMaster===eanBipado){produtoEncontrado=prod;isMaster=true;break;}}
    if(!produtoEncontrado){document.getElementById(fieldProduct).value='';return alert("Código não encontrado no Catálogo. Cadastre-o primeiro.");}
    
    const qtdAdicionar=(isMaster?produtoEncontrado.qtdMaster:1)*mult;const caixasAdicionar=(isMaster?1:0)*mult;
    document.getElementById(fieldProduct).value='';document.getElementById(fieldProduct).focus();document.getElementById(fieldMultiplier).value='1';
    
    try{
        const docId=`${endereco}_${lote}_${produtoEncontrado.eanUnitario}`;
        const docRef=db.collection("estoque_posicoes").doc(docId);
        const docSnap=await docRef.get();
        if(docSnap.exists){
            await docRef.update({quantidade:firebase.firestore.FieldValue.increment(qtdAdicionar),caixas:firebase.firestore.FieldValue.increment(caixasAdicionar),dataEntrada:dataEnt,familia:fam});
        }else{
            await docRef.set({endereco:endereco,lote:lote,ean:produtoEncontrado.eanUnitario,sku:produtoEncontrado.sku,quantidade:qtdAdicionar,caixas:caixasAdicionar,dataEntrada:dataEnt,familia:fam,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
        }
        carregarMapaEstoque(perfil);
    }catch(e){alert("Erro ao guardar estoque.");}
}

async function zerarPosicaoEstoque(id,perfil){if(confirm("Tem certeza que deseja apagar este saldo do mapa?")){await db.collection("estoque_posicoes").doc(id).delete();carregarMapaEstoque(perfil);}}
async function abrirEdicaoInbound(id_doc,perfil){idEditLoteGlobal={id:id_doc,perfil:perfil};try{const doc=await db.collection("estoque_posicoes").doc(id_doc).get();const data=doc.data();document.getElementById('editInboundAddress').value=data.endereco;document.getElementById('editInboundLot').value=data.lote;document.getElementById('editInboundData').value=data.dataEntrada||'';document.getElementById('editInboundFamilia').value=data.familia||'Cabo';document.getElementById('modalEditarInbound').style.display='flex';}catch(e){alert("Erro ao carregar dados.");}}
async function salvarEdicaoInboundNuvem(){const end=document.getElementById('editInboundAddress').value.toUpperCase();const lot=document.getElementById('editInboundLot').value.toUpperCase();const dat=document.getElementById('editInboundData').value;const fam=document.getElementById('editInboundFamilia').value;try{await db.collection("estoque_posicoes").doc(idEditLoteGlobal.id).update({endereco:end,lote:lot,dataEntrada:dat,familia:fam});alert("Dados corrigidos!");document.getElementById('modalEditarInbound').style.display='none';carregarMapaEstoque(idEditLoteGlobal.perfil);}catch(e){alert("Erro ao atualizar.");}}

async function abrirModuloResumoEstoque(){
    navegarAdmin('adminResumoEstoque');
    document.getElementById('resumoCx').innerText="...";document.getElementById('resumoUn').innerText="...";document.getElementById('resumoSkus').innerText="...";
    try{
        const snapshot=await db.collection("estoque_posicoes").get();let totalCx=0;let totalUn=0;let skusSet=new Set();let skuMap={};
        snapshot.forEach(doc=>{const item=doc.data();if(item.quantidade>0){totalCx+=item.caixas;totalUn+=item.quantidade;skusSet.add(item.sku);if(!skuMap[item.sku])skuMap[item.sku]={sku:item.sku,qtd:0,locs:new Set()};skuMap[item.sku].qtd+=item.quantidade;skuMap[item.sku].locs.add(item.endereco);}});
        document.getElementById('resumoCx').innerText=totalCx;document.getElementById('resumoUn').innerText=totalUn;document.getElementById('resumoSkus').innerText=skusSet.size;
        
        const containerCards=document.getElementById('cardsEstoqueDashboard');containerCards.innerHTML='';
        let sortedSkusMap=Object.values(skuMap).sort((a,b)=>b.qtd-a.qtd);
        sortedSkusMap.forEach(s=>{const locaisStr=Array.from(s.locs).join(', ');containerCards.innerHTML+=`<div class="hub-card hub-card-neutral" style="min-height:auto;padding:15px;"><h3 style="font-size:18px;color:var(--volt-green);margin-bottom:5px;">${s.sku}</h3><p style="font-size:14px;color:white;margin-bottom:5px;">Total: <strong>${s.qtd} un</strong></p><p style="font-size:11px;color:#888;margin:0;line-height:1.3;">Endereços: ${locaisStr}</p></div>`;});
    }catch(e){}
}

function abrirModuloAcessos(){navegarAdmin('adminAcessos');renderizarTabelaAcessosAdmin();}
function renderizarTabelaAcessosAdmin(){const tbody=document.getElementById('tabelaEquipeUsuarios');tbody.innerHTML='';for(let nome in bdUsuariosLogistica){const user=bdUsuariosLogistica[nome];const isAtivo=(user.status!=='inativo');tbody.innerHTML+=`<tr style="${!isAtivo?'opacity:.5;background:rgba(255,51,51,.05);':''}"><td><strong>${nome}</strong></td><td>${user.role.toUpperCase()}</td><td><span class="${isAtivo?'status-online':'status-offline'}">${isAtivo?'Ativo':'Desligado'}</span></td><td style="text-align:right;"><button class="btn-outline-2" style="border-color:${isAtivo?'var(--error-red)':'var(--success-green)'};color:${isAtivo?'var(--error-red)':'var(--success-green)'};" onclick="toggleStatusUsuarioNuvem('${nome}',${isAtivo})">${isAtivo?'Desligar':'Reativar'}</button></td></tr>`;}}
async function toggleStatusUsuarioNuvem(nome,isAtivo){if(isAtivo&&!confirm(`Desativar o acesso de ${nome}?`))return;try{await db.collection("usuarios").doc(nome).update({status:isAtivo?'inativo':'ativo'});await carregarUsuariosDaNuvem();renderizarTabelaAcessosAdmin();}catch(error){}}
async function salvarNovoUsuario(){const nome=document.getElementById('novoNome').value.trim();const role=document.getElementById('novoRole').value;const senha=document.getElementById('novoSenha').value.trim();if(!nome||!senha)return alert("Preencha Nome e Senha.");try{await db.collection("usuarios").doc(nome).set({role:role,senha:senha,status:'ativo'});alert(`✅ Perfil gerado!`);document.getElementById('modalNovoUsuario').style.display='none';await carregarUsuariosDaNuvem();renderizarTabelaAcessosAdmin();}catch(error){}}
</script>
